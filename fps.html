<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>FPS 射击游戏</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000;
      overflow: hidden;
      font-family: "Microsoft Yahei", Arial, sans-serif;
      cursor: default;
    }

    #canvas {
      display: block;
    }

    /* ===== HUD ===== */
    #hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }

    /* 准星（四条独立线，间距由 JS 动态控制扩散） */
    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 0;
      height: 0;
    }

    .ch-line {
      position: absolute;
      background: rgba(255, 255, 255, 0.85);
      box-shadow: 0 0 3px rgba(0, 0, 0, 0.8);
      transition: none;
    }

    .ch-top {
      width: 2px;
      height: 10px;
      left: -1px;
      top: calc(var(--ch-gap, 14px) * -1 - 10px);
    }

    .ch-bottom {
      width: 2px;
      height: 10px;
      left: -1px;
      top: var(--ch-gap, 14px);
    }

    .ch-left {
      height: 2px;
      width: 10px;
      top: -1px;
      left: calc(var(--ch-gap, 14px) * -1 - 10px);
    }

    .ch-right {
      height: 2px;
      width: 10px;
      top: -1px;
      left: var(--ch-gap, 14px);
    }

    #crosshair-dot {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #ff4444;
      box-shadow: 0 0 4px #ff4444;
    }

    /* 命中标记 */
    #hitmark {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 30px;
      height: 30px;
      opacity: 0;
      transition: opacity 0.1s;
    }

    #hitmark.show {
      opacity: 1;
    }

    #hitmark::before,
    #hitmark::after {
      content: '';
      position: absolute;
      background: #ff0000;
    }

    #hitmark::before {
      width: 2px;
      height: 30px;
      left: 14px;
      transform: rotate(45deg);
    }

    #hitmark::after {
      width: 30px;
      height: 2px;
      top: 14px;
      transform: rotate(45deg);
    }

    /* 底部状态栏 */
    #bottom-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding: 20px 40px;
    }

    .stat-block {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .stat-label {
      font-size: 13px;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .health-bar {
      width: 200px;
      height: 18px;
      background: #222;
      border: 2px solid #555;
      border-radius: 2px;
      overflow: hidden;
    }

    #health-fill {
      height: 100%;
      background: linear-gradient(90deg, #ff4444, #ff8844, #44ff44);
      transition: width 0.3s;
    }

    .stat-value {
      font-size: 28px;
      font-weight: bold;
      color: #fff;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
    }

    .right-block {
      align-items: flex-end;
      text-align: right;
    }

    /* 受伤红色覆盖 */
    #damage-overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 30%, rgba(255, 0, 0, 0.5) 100%);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s;
    }

    /* 低血量警告 */
    #low-health-overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(150, 0, 0, 0.4) 100%);
      opacity: 0;
      pointer-events: none;
    }

    #low-health-overlay.active {
      animation: heartbeat 1.2s ease-in-out infinite;
    }

    @keyframes heartbeat {

      0%,
      100% {
        opacity: 0.25;
      }

      50% {
        opacity: 0.6;
      }
    }

    /* 伤害方向指示器 */
    #damage-direction {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }

    #damage-direction.show {
      opacity: 1;
    }

    .damage-arrow {
      position: absolute;
      top: -140px;
      left: -35px;
      width: 70px;
      height: 70px;
      background: rgba(255, 0, 0, 0.7);
      clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
      filter: drop-shadow(0 0 12px rgba(255, 0, 0, 0.9));
    }

    /* 顶部信息 */
    #top-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 60px;
      padding: 20px;
    }

    .top-item {
      text-align: center;
    }

    .top-label {
      font-size: 12px;
      color: #888;
      letter-spacing: 2px;
    }

    .top-value {
      font-size: 32px;
      font-weight: bold;
      color: #fff;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
    }

    /* 开始/结束画面 */
    #overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      cursor: pointer;
    }

    #overlay h1 {
      font-size: 64px;
      color: #ff4444;
      text-shadow: 0 0 20px #ff4444;
      margin-bottom: 20px;
    }

    #overlay p {
      font-size: 20px;
      color: #ccc;
      margin-bottom: 10px;
    }

    .key-hint {
      color: #ffd444;
      font-weight: bold;
    }

    #overlay .start-btn {
      margin-top: 30px;
      padding: 12px 48px;
      font-size: 24px;
      color: #fff;
      background: #ff4444;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(255, 68, 68, 0.4);
    }

    #overlay .start-btn:hover {
      background: #ff6666;
      transform: scale(1.05);
    }

    /* 武器视图 */
    #weapon-view {
      position: absolute;
      bottom: 0;
      right: 15%;
      width: 320px;
      height: 220px;
      pointer-events: none;
      transition: transform 0.06s;
    }

    /* 换弹提示 */
    #reload-hint {
      position: absolute;
      top: 58%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 24px;
      color: #ffd444;
      font-weight: bold;
      text-shadow: 0 0 8px rgba(0, 0, 0, 0.8);
      opacity: 0;
      transition: opacity 0.3s;
    }

    #reload-hint.show {
      opacity: 1;
    }

    /* 补给拾取提示 */
    #pickup-msg {
      position: absolute;
      top: 62%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 26px;
      font-weight: bold;
      text-shadow: 0 0 10px rgba(0, 0, 0, 0.9);
      opacity: 0;
      transition: opacity 0.3s;
    }

    #pickup-msg.show {
      opacity: 1;
    }

    /* 换弹进度圈 */
    #reload-progress {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
    }

    #reload-progress.show {
      opacity: 1;
    }

    #reload-progress svg {
      transform: rotate(-90deg);
    }

    #reload-progress-circle {
      transition: stroke-dashoffset 0.1s linear;
    }

    #reload-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 12px;
      color: #ffd444;
      font-weight: bold;
      text-shadow: 0 0 4px rgba(0, 0, 0, 0.8);
    }

    /* 枪口火光 */
    #muzzle-flash {
      position: absolute;
      bottom: 130px;
      right: 22%;
      width: 120px;
      height: 120px;
      background: radial-gradient(circle, rgba(255, 220, 100, 0.9), rgba(255, 150, 50, 0.4) 50%, transparent 70%);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.04s;
    }
  </style>
</head>

<body>
  <canvas id="canvas"></canvas>

  <div id="hud">
    <div id="damage-overlay"></div>
    <div id="low-health-overlay"></div>

    <!-- 伤害方向指示器 -->
    <div id="damage-direction">
      <div class="damage-arrow"></div>
    </div>

    <!-- 顶部：分数/波数 -->
    <div id="top-bar">
      <div class="top-item">
        <div class="top-label">分数</div>
        <div class="top-value" id="score">0</div>
      </div>
      <div class="top-item">
        <div class="top-label">波数</div>
        <div class="top-value" id="wave">1</div>
      </div>
      <div class="top-item">
        <div class="top-label">敌人</div>
        <div class="top-value" id="enemy-count">0</div>
      </div>
    </div>

    <!-- 准星 -->
    <div id="crosshair" style="--ch-gap:14px">
      <div class="ch-line ch-top"></div>
      <div class="ch-line ch-bottom"></div>
      <div class="ch-line ch-left"></div>
      <div class="ch-line ch-right"></div>
    </div>
    <div id="crosshair-dot"></div>
    <div id="hitmark"></div>
    <div id="reload-hint">按 R 换弹</div>
    <div id="pickup-msg"></div>

    <!-- 换弹进度圈 -->
    <div id="reload-progress">
      <svg width="56" height="56" viewBox="0 0 56 56">
        <circle cx="28" cy="28" r="24" stroke="rgba(255,255,255,0.2)" stroke-width="3" fill="none" />
        <circle id="reload-progress-circle" cx="28" cy="28" r="24" stroke="#ffd444" stroke-width="3" fill="none"
          stroke-dasharray="150.8" stroke-dashoffset="150.8" stroke-linecap="round" />
      </svg>
      <div id="reload-text">换弹</div>
    </div>

    <!-- 枪口火光 -->
    <div id="muzzle-flash"></div>

    <!-- 底部：血量/弹药 -->
    <div id="bottom-bar">
      <div class="stat-block">
        <div class="stat-label">生命值</div>
        <div class="health-bar">
          <div id="health-fill" style="width:100%"></div>
        </div>
        <div class="stat-value" id="health-text">100</div>
      </div>
      <div class="stat-block right-block">
        <div class="stat-label">弹药</div>
        <div class="stat-value" id="ammo-text">90 / 5000</div>
      </div>
    </div>

    <!-- 武器视图 -->
    <div id="weapon-view"></div>
  </div>

  <!-- 开始/结束画面 -->
  <div id="overlay">
    <h1 id="overlay-title">FPS 射击</h1>
    <p>鼠标移动 — 环顾四周</p>
    <p><span class="key-hint">WASD</span> 移动 &nbsp; <span class="key-hint">空格</span> 跳跃 &nbsp; <span
        class="key-hint">Shift</span> 奔跑</p>
    <p><span class="key-hint">左键</span> 重狙(3倍伤害) &nbsp; <span class="key-hint">滚轮按下</span> 连射 &nbsp; <span
        class="key-hint">R</span> 换弹 &nbsp; <span class="key-hint">ESC</span> 暂停</p>
    <p>消灭所有敌人，活到最后！</p>
    <button class="start-btn" id="start-btn">点击开始</button>
  </div>

  <!-- r128 UMD 版本 -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>

  <script>
    // ===== 场景初始化 =====
    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0x3d3648, 32, 90);

    const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 180);
    camera.position.set(0, 1.7, 0);

    const renderer = new THREE.WebGLRenderer({
      canvas: document.getElementById('canvas'),
      antialias: true,
      powerPreference: 'high-performance'
    });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.25));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFShadowMap;
    // 阴影按需更新：场景静态，仅泰坦投射动态阴影，无泰坦时冻结阴影贴图省一次深度渲染
    renderer.shadowMap.autoUpdate = false;
    renderer.shadowMap.needsUpdate = true;
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.85;

    // ===== 天空（黄昏偏暗渐变）——挂在相机上，永远包裹视角，避免远处被裁剪露出黑块 =====
    (function createSky() {
      const c = document.createElement('canvas');
      c.width = 64; c.height = 512;
      const ctx = c.getContext('2d');
      const grad = ctx.createLinearGradient(0, 0, 0, 512);
      grad.addColorStop(0, '#030612');
      grad.addColorStop(0.3, '#0e1a33');
      grad.addColorStop(0.55, '#27334f');
      grad.addColorStop(0.78, '#5e3a2e');
      grad.addColorStop(0.9, '#6e3524');
      grad.addColorStop(1, '#331a14');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 64, 512);
      const tex = new THREE.CanvasTexture(c);
      const skyGeo = new THREE.SphereGeometry(80, 24, 12);
      const skyMat = new THREE.MeshBasicMaterial({ map: tex, side: THREE.BackSide, fog: false, depthWrite: false });
      const sky = new THREE.Mesh(skyGeo, skyMat);
      sky.renderOrder = -1;
      sky.frustumCulled = false;
      camera.add(sky);
      scene.add(camera); // 确保相机在场景树中（PointerLockControls 也会 add）
    })();

    // ===== 灯光（黄昏偏暗）=====
    const hemiLight = new THREE.HemisphereLight(0x5577bb, 0x554433, 0.3);
    scene.add(hemiLight);

    const ambient = new THREE.AmbientLight(0x445588, 0.16);
    scene.add(ambient);

    const dirLight = new THREE.DirectionalLight(0xddccaa, 0.68);
    dirLight.position.set(30, 50, 20);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.set(1024, 1024);
    dirLight.shadow.camera.left = -45;
    dirLight.shadow.camera.right = 45;
    dirLight.shadow.camera.top = 45;
    dirLight.shadow.camera.bottom = -45;
    dirLight.shadow.camera.near = 1;
    dirLight.shadow.camera.far = 110;
    dirLight.shadow.bias = -0.001;
    scene.add(dirLight);

    // ===== 纹理生成 =====
    function makeGroundTexture() {
      const c = document.createElement('canvas');
      c.width = c.height = 512;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#5a5a4a';
      ctx.fillRect(0, 0, 512, 512);
      for (let i = 0; i < 5000; i++) {
        const x = Math.random() * 512, y = Math.random() * 512, r = Math.random() * 3;
        const s = Math.random() * 40 - 20;
        ctx.fillStyle = `rgba(${100 + s},${95 + s},${80 + s},0.3)`;
        ctx.fillRect(x, y, r, r);
      }
      ctx.strokeStyle = 'rgba(40,40,30,0.35)';
      ctx.lineWidth = 2;
      for (let i = 0; i <= 512; i += 128) {
        ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 512); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(512, i); ctx.stroke();
      }
      ctx.strokeStyle = 'rgba(30,25,20,0.5)';
      ctx.lineWidth = 1;
      for (let i = 0; i < 25; i++) {
        ctx.beginPath();
        let x = Math.random() * 512, y = Math.random() * 512;
        ctx.moveTo(x, y);
        for (let j = 0; j < 6; j++) { x += (Math.random() - 0.5) * 50; y += (Math.random() - 0.5) * 50; ctx.lineTo(x, y); }
        ctx.stroke();
      }
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(20, 20);
      return tex;
    }

    function makeBrickTexture() {
      const c = document.createElement('canvas');
      c.width = c.height = 256;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#3a3a35';
      ctx.fillRect(0, 0, 256, 256);
      const bh = 32, bw = 64;
      for (let y = 0; y < 256; y += bh) {
        const off = (y / bh) % 2 === 0 ? 0 : bw / 2;
        for (let x = -bw; x < 256; x += bw) {
          ctx.fillStyle = `rgb(${100 + Math.random() * 30},${80 + Math.random() * 20},${65 + Math.random() * 15})`;
          ctx.fillRect(x + off + 2, y + 2, bw - 4, bh - 4);
        }
      }
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      return tex;
    }

    function makeWoodTexture() {
      const c = document.createElement('canvas');
      c.width = c.height = 256;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#6a4a2a';
      ctx.fillRect(0, 0, 256, 256);
      for (let i = 0; i < 30; i++) {
        const y = i * 9 + Math.random() * 2;
        ctx.strokeStyle = `rgba(${40 + Math.random() * 30},${25 + Math.random() * 15},15,0.4)`;
        ctx.lineWidth = 1 + Math.random() * 2;
        ctx.beginPath(); ctx.moveTo(0, y);
        for (let x = 0; x < 256; x += 20) ctx.lineTo(x, y + (Math.random() - 0.5) * 4);
        ctx.stroke();
      }
      ctx.strokeStyle = 'rgba(30,20,10,0.6)';
      ctx.lineWidth = 2;
      [85, 171].forEach(y => { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(256, y); ctx.stroke(); });
      const tex = new THREE.CanvasTexture(c);
      return tex;
    }

    const texGround = makeGroundTexture();
    const texBrick = makeBrickTexture();
    const texBrick2 = makeBrickTexture();
    texBrick.repeat.set(3, 1); texBrick2.repeat.set(1, 3);
    const texWood = makeWoodTexture();
    const texWood2 = makeWoodTexture();

    // ===== 地面 =====
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(100, 100),
      new THREE.MeshStandardMaterial({ map: texGround, roughness: 0.9, metalness: 0.05 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // ===== 围墙 =====
    const walls = [];
    const wallMat = new THREE.MeshStandardMaterial({ map: texBrick, roughness: 0.8 });
    const wallMat2 = new THREE.MeshStandardMaterial({ map: texBrick2, roughness: 0.8 });
    const wallH = 6;
    const wallConfigs = [
      { size: [100, wallH, 1], pos: [0, wallH / 2, -50], mat: wallMat },
      { size: [100, wallH, 1], pos: [0, wallH / 2, 50], mat: wallMat },
      { size: [1, wallH, 100], pos: [-50, wallH / 2, 0], mat: wallMat2 },
      { size: [1, wallH, 100], pos: [50, wallH / 2, 0], mat: wallMat2 },
    ];
    wallConfigs.forEach(cfg => {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(...cfg.size), cfg.mat);
      mesh.position.set(...cfg.pos);
      mesh.castShadow = true; mesh.receiveShadow = true;
      scene.add(mesh);
      walls.push(mesh);
    });

    // ===== 掩体/障碍物 =====
    // topY: 顶部高度，玩家脚部高于 topY-0.25 时可站立其上（可跳上去）
    const obstacles = [];

    function createCrate(x, z, size) {
      const group = new THREE.Group();
      const geo = new THREE.BoxGeometry(size, size, size);
      const mat = new THREE.MeshStandardMaterial({ map: texWood, roughness: 0.8 });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.castShadow = true; mesh.receiveShadow = true;
      group.add(mesh);
      // 金属角铁
      const cornerMat = new THREE.MeshStandardMaterial({ color: 0x555555, metalness: 0.8, roughness: 0.3 });
      const cornerGeo = new THREE.BoxGeometry(0.2, size + 0.05, 0.2);
      [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([cx, cz]) => {
        const cm = new THREE.Mesh(cornerGeo, cornerMat);
        cm.position.set(cx * (size / 2 - 0.1), 0, cz * (size / 2 - 0.1));
        cm.castShadow = true;
        group.add(cm);
      });
      group.position.set(x, size / 2, z);
      scene.add(group);
      obstacles.push({ group, halfX: size / 2, halfZ: size / 2, minX: x - size / 2, maxX: x + size / 2, minZ: z - size / 2, maxZ: z + size / 2, topY: size });
    }

    function createBarrel(x, z) {
      const group = new THREE.Group();
      const r = 0.55, h = 1.5;
      const body = new THREE.Mesh(
        new THREE.CylinderGeometry(r, r, h, 20),
        new THREE.MeshStandardMaterial({ color: 0xcc4422, roughness: 0.4, metalness: 0.5 })
      );
      body.castShadow = true; body.receiveShadow = true;
      group.add(body);
      // 警示条
      const bandMat = new THREE.MeshStandardMaterial({ color: 0xffcc00, emissive: 0x442200, emissiveIntensity: 0.3, metalness: 0.4, roughness: 0.5 });
      const bandGeo = new THREE.CylinderGeometry(r + 0.01, r + 0.01, 0.12, 20);
      [0.35, -0.35].forEach(y => {
        const b = new THREE.Mesh(bandGeo, bandMat);
        b.position.y = y;
        b.castShadow = true;
        group.add(b);
      });
      // 顶盖
      const top = new THREE.Mesh(new THREE.CylinderGeometry(r, r, 0.05, 20), new THREE.MeshStandardMaterial({ color: 0x333333, metalness: 0.9, roughness: 0.2 }));
      top.position.y = h / 2 + 0.025;
      top.castShadow = true;
      group.add(top);
      group.position.set(x, h / 2, z);
      scene.add(group);

    function createLowWall(x, z, len, h) {

    // ===== 音效系统 =====
    let audioCtx = null;
    // 共享噪声 buffer：只生成一次，所有音效复用，避免播放时主线程填充上万随机数造成延迟
    let noiseBufShort = null, noiseBufLong = null;
    function initAudio() {
      if (!audioCtx) {
        try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
        catch (e) { console.warn('音频初始化失败', e); }
      }
      if (audioCtx) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        if (!noiseBufShort) {
          // 短噪声 0.3s（枪声）、长噪声 1s（爆炸/敌人音效）；衰减统一由 gain 节点控制
          noiseBufShort = audioCtx.createBuffer(1, 13230, 44100);
          const ds = noiseBufShort.getChannelData(0);
          for (let i = 0; i < ds.length; i++) ds[i] = Math.random() * 2 - 1;
          noiseBufLong = audioCtx.createBuffer(1, 44100, 44100);
          const dl = noiseBufLong.getChannelData(0);
          for (let i = 0; i < dl.length; i++) dl[i] = Math.random() * 2 - 1;
        }
      }
    }

    function playGunshot() {
      if (!audioCtx || audioCtx.state === 'suspended') return;
      const t = audioCtx.currentTime;
      // 噪声爆裂（复用预生成 buffer）
      const src = audioCtx.createBufferSource();
      src.buffer = noiseBufShort;
      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.3, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(4000, t);
      filter.frequency.exponentialRampToValueAtTime(800, t + 0.1);
      src.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
      src.start(t); src.stop(t + 0.12);
      // 低频冲击
      const osc = audioCtx.createOscillator();
      const og = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(120, t);
      osc.frequency.exponentialRampToValueAtTime(40, t + 0.08);
      og.gain.setValueAtTime(0.35, t);
      og.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
      osc.connect(og); og.connect(audioCtx.destination);
      osc.start(t); osc.stop(t + 0.1);
    }

      filter.frequency.setValueAtTime(2600, t);

      src.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
      src.start(t); src.stop(t + 0.28);
      const osc = audioCtx.createOscillator();

      osc.type = 'sine';

    function playPlayerHurt() {

    // ===== 怪物专属音效 =====
    // 通用：音调
    function sfxTone(waveform, f0, f1, dur, vol, when) {
      if (!audioCtx) return;
      const t = (when || 0) + audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = waveform;
      osc.frequency.setValueAtTime(f0, t);
      osc.frequency.exponentialRampToValueAtTime(Math.max(f1, 1), t + dur);
      gain.gain.setValueAtTime(vol, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(t); osc.stop(t + dur + 0.02);
    }
    // 通用：噪声（带滤波）
    function sfxNoise(dur, vol, filterType, f0, f1, when) {
      if (!audioCtx || !noiseBufLong) return;
      const t = (when || 0) + audioCtx.currentTime;
      const src = audioCtx.createBufferSource();
      src.buffer = noiseBufLong; // 复用预生成噪声，衰减由 gain 控制
      const filter = audioCtx.createBiquadFilter();
      filter.type = filterType || 'lowpass';
      filter.frequency.setValueAtTime(f0 || 2000, t);
      if (f1) filter.frequency.exponentialRampToValueAtTime(f1, t + dur);
      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(vol, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
      src.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
      src.start(t); src.stop(t + dur + 0.02);
    }
    // 距离衰减系数（0.1~1）
    function sfxDist(dist) {
      if (dist == null) return 0.8;
      return Math.max(0.08, Math.min(1, 1 - dist / 50));
    }
    // 大爆炸（自爆虫/泰坦死亡）
    function playExplosion(vol) {
      if (!audioCtx || audioCtx.state === 'suspended') return;
      sfxNoise(0.6, vol || 0.5, 'lowpass', 3000, 100);
      sfxTone('sine', 90, 28, 0.5, (vol || 0.5) * 0.9);
      sfxTone('square', 60, 25, 0.3, (vol || 0.5) * 0.3);
    }
    // 怪物音效分发：action = hit / death / attack / special
    function playEnemySound(type, action, dist) {
      if (!audioCtx || audioCtx.state === 'suspended') return;
      const d = sfxDist(dist);
      if (type === 'scout') {
        if (action === 'hit') { sfxTone('triangle', 1800, 900, 0.07, 0.14 * d); sfxNoise(0.05, 0.08 * d, 'highpass', 3000); }
        else if (action === 'death') { sfxTone('sawtooth', 700, 90, 0.35, 0.22 * d); sfxNoise(0.2, 0.14 * d, 'bandpass', 2500, 600); }
        else if (action === 'attack') { sfxTone('square', 1300, 350, 0.16, 0.16 * d); }
      } else if (type === 'hunter') {
        if (action === 'hit') { sfxTone('triangle', 2400, 1400, 0.06, 0.12 * d); }
        else if (action === 'death') { sfxNoise(0.25, 0.2 * d, 'bandpass', 3500, 500); sfxTone('sawtooth', 900, 120, 0.3, 0.18 * d); }
        else if (action === 'attack') { sfxNoise(0.22, 0.16 * d, 'bandpass', 800, 3200); }
      } else if (type === 'crawler') {
        if (action === 'hit') { sfxTone('sine', 200, 90, 0.12, 0.2 * d); sfxNoise(0.08, 0.1 * d, 'lowpass', 700); }
        else if (action === 'death') { sfxTone('sawtooth', 300, 60, 0.4, 0.24 * d); sfxNoise(0.35, 0.2 * d, 'lowpass', 1200, 200); }
        else if (action === 'attack') { sfxTone('square', 260, 140, 0.06, 0.16 * d); sfxTone('square', 220, 120, 0.06, 0.16 * d, 0.09); }
      } else if (type === 'bomber') {
        if (action === 'hit') { sfxTone('sine', 240, 110, 0.1, 0.16 * d); sfxNoise(0.08, 0.1 * d, 'lowpass', 900); }
        else if (action === 'death') { playExplosion(0.35 * d); }
        else if (action === 'explosion') { playExplosion(0.55 * d); }
        else if (action === 'beep') { sfxTone('square', 950, 950, 0.07, 0.18 * d); }
      } else if (type === 'swarmer') {
        if (action === 'hit') { sfxTone('triangle', 2800, 2000, 0.05, 0.1 * d); }
        else if (action === 'death') { sfxNoise(0.12, 0.12 * d, 'highpass', 2000); sfxTone('square', 1500, 300, 0.12, 0.1 * d); }
        else if (action === 'attack') { sfxTone('sawtooth', 3200, 2400, 0.08, 0.1 * d); sfxTone('sawtooth', 3000, 2200, 0.08, 0.1 * d, 0.1); }
      } else if (type === 'wraith') {
        if (action === 'hit') { sfxTone('sine', 880, 1320, 0.25, 0.15 * d); sfxTone('sine', 1320, 1760, 0.25, 0.08 * d); }
        else if (action === 'death') { sfxTone('sine', 500, 120, 0.6, 0.22 * d); sfxNoise(0.5, 0.12 * d, 'bandpass', 1200, 200); }
        else if (action === 'attack') { sfxTone('sine', 700, 300, 0.2, 0.15 * d); }
        else if (action === 'dash') { sfxNoise(0.28, 0.18 * d, 'bandpass', 400, 2400); }
      } else if (type === 'titan') {
        if (action === 'hit') { sfxTone('square', 160, 70, 0.12, 0.25 * d); sfxNoise(0.1, 0.16 * d, 'lowpass', 600); }
        else if (action === 'death') { playExplosion(0.6 * d); sfxTone('sawtooth', 200, 40, 0.7, 0.25 * d); }
        else if (action === 'attack') { sfxTone('sine', 100, 35, 0.3, 0.4 * d); sfxNoise(0.2, 0.25 * d, 'lowpass', 800, 150); }
      }
    }

    function playReload() {
      if (!audioCtx || audioCtx.state === 'suspended') return;
      const t = audioCtx.currentTime;
      // 弹匣释放
      const o1 = audioCtx.createOscillator(); const g1 = audioCtx.createGain();
      o1.type = 'square'; o1.frequency.setValueAtTime(200, t);
      o1.frequency.exponentialRampToValueAtTime(80, t + 0.05);
      g1.gain.setValueAtTime(0.15, t); g1.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
      o1.connect(g1); g1.connect(audioCtx.destination);
      o1.start(t); o1.stop(t + 0.08);
      // 弹匣插入
      const o2 = audioCtx.createOscillator(); const g2 = audioCtx.createGain();
      o2.type = 'square'; o2.frequency.setValueAtTime(300, t + 0.7);
      o2.frequency.exponentialRampToValueAtTime(150, t + 0.75);

      const src = audioCtx.createBufferSource(); src.buffer = noiseBufShort;
      const g3 = audioCtx.createGain();
      g3.gain.setValueAtTime(0.1, t + 1.2);
      g3.gain.exponentialRampToValueAtTime(0.001, t + 1.35);
